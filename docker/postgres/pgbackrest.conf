# pgBackRest do banco de hml e prod (US-015; plano do P3, Tarefa 7). Só o que não é segredo nem muda
# por ambiente. O resto vem das variáveis do serviço db no Easypanel, que o pgBackRest lê sozinho:
#   PGBACKREST_REPO1_S3_BUCKET, PGBACKREST_REPO1_S3_ENDPOINT, PGBACKREST_REPO1_S3_REGION,
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_PATH (/hml ou /prod)
#   e PGBACKREST_REPO1_CIPHER_PASS (a senha do cofre, com cópia fora da VPS).
[global]
repo1-type=s3
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=30
compress-type=zst
start-fast=y
archive-async=n
log-level-console=info
log-level-file=off

[sgo]
pg1-path=/var/lib/postgresql/data
