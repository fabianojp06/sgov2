name: Imagem e deploy

# US-013 parte 2/3 (plano do P3, Tarefa 4, Step 7).
# - push na main  → publica sgov2:sha-<commit> e sgov2:hml, registra o digest no artefato
#                   origem-imagem do run e chama o webhook de hml;
# - tag vX.Y.Z    → verificar-prod (sem environment) e prod (environment "producao", aprovação do PO):
#                   copia o digest registrado pelo run da main para sgov2-prod:vX.Y.Z e :prod, sem reconstruir;
# - workflow_dispatch acao=teste    → publica só sgov2:teste-<nome>, sem webhook;
# - workflow_dispatch acao=rollback → disparado pelo PO com --ref vX.Y.Z: sgov2-prod:prod volta a vX.Y.Z.
# Toda condição de job olha o tipo de evento: um dispatch com --ref de tag também tem github.ref de tag.
# Os secrets ficam só nos environments, nunca no repositório.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      acao:
        description: 'teste (publica sgov2:teste-<nome>) ou rollback (volta o prod para a tag do --ref)'
        required: true
        type: choice
        options: [teste, rollback]
      nome:
        description: 'Nome da imagem de teste (a-z, 0-9 e hífen; só para acao=teste)'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGEM: ghcr.io/fabianojp06/sgov2
  IMAGEM_PROD: ghcr.io/fabianojp06/sgov2-prod

jobs:
  hml:
    name: Publicar e implantar em hml
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: homologacao
    concurrency:
      group: deploy-hml
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM }}:sha-${{ github.sha }}
            ${{ env.IMAGEM }}:hml
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Cache do Actions, isolado por branch: uma branch não grava no cache que a main lê.
          # Um cache no GHCR seria gravável pelo GITHUB_TOKEN de qualquer branch e chegaria ao prod
          # pelo run da main (revisão 12.12 do PR #188).
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Registro da origem. A atestação do GitHub (attest-build-provenance) não existe para
      # repositório privado de usuário. O artefato fica preso a este run (push na main, este
      # workflow), e o GitHub não deixa outro run gravar nele: o verificar-prod confia no run,
      # não na tag sha-<commit>, que qualquer branch com packages:write pode sobrescrever.
      - name: Registrar o digest deste run
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Digest inválido do build: '$DIGEST'."; exit 1; }
          mkdir -p origem
          jq -n --arg digest "$DIGEST" --arg commit "$GITHUB_SHA" '{digest: $digest, commit: $commit}' > origem/origem.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: origem-imagem
          path: origem/origem.json
          if-no-files-found: error
          # Num re-run, o artefato da tentativa anterior do mesmo run é trocado, e não dá conflito.
          overwrite: true
          # O máximo padrão do repositório. Depois disso, a tag precisa ir num commit mais novo
          # da main (docs/operacao/deploy.md).
          retention-days: 90
      - name: Webhook do Easypanel (hml)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK }}
          OBRIGATORIO: ${{ vars.HML_WEBHOOK_OBRIGATORIO }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            # Depois da Tarefa 6, o PO define HML_WEBHOOK_OBRIGATORIO=1 no environment, e a falta vira erro.
            if [ "$OBRIGATORIO" = 1 ]; then echo "::error::Webhook de hml não cadastrado."; exit 1; fi
            echo "::warning::Deploy de hml pendente: webhook não cadastrado no environment homologacao (Tarefa 6)."
            exit 0
          fi
          codigo=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK") || codigo=erro
          [[ "$codigo" == 2?? ]] || { echo "::error::Webhook de hml respondeu $codigo."; exit 1; }
          echo "Deploy de hml solicitado ao Easypanel (HTTP $codigo). A confirmação de que subiu é manual até a Tarefa 6."
      # O webhook do Easypanel é por serviço: o worker (mesma imagem, CMD worker) tem o dele.
      - name: Webhook do Easypanel (hml, worker)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK_WORKER }}
          OBRIGATORIO: ${{ vars.HML_WEBHOOK_OBRIGATORIO }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            if [ "$OBRIGATORIO" = 1 ]; then echo "::error::Webhook do worker de hml não cadastrado."; exit 1; fi
            echo "::warning::Deploy do worker de hml pendente: EASYPANEL_WEBHOOK_WORKER não cadastrado no environment homologacao (Tarefa 6)."
            exit 0
          fi
          codigo=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK") || codigo=erro
          [[ "$codigo" == 2?? ]] || { echo "::error::Webhook do worker de hml respondeu $codigo."; exit 1; }
          echo "Deploy do worker de hml solicitado ao Easypanel (HTTP $codigo)."

  banco:
    # Imagem do banco de hml e prod com o pgBackRest (US-015; docker/postgres-ambiente.Dockerfile).
    # Sem webhook: o PO troca a imagem do serviço db no Easypanel pela tag sha-<commit> quando ela mudar
    # (docs/operacao/backup.md). A tag atual é a do teste de restauração no host.
    name: Publicar a imagem do banco
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/postgres-ambiente.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM }}-postgres:sha-${{ github.sha }}
            ${{ env.IMAGEM }}-postgres:atual
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=banco
          cache-to: type=gha,mode=max,scope=banco

  verificar-prod:
    # Sem environment: a aprovação de um environment acontece antes de qualquer passo do job, então
    # as checagens ficam aqui, e o PO lê o resumo antes de aprovar o job prod.
    name: Verificar a release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: O commit da tag está na main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::O commit da tag $GITHUB_REF_NAME não está na main."; exit 1; }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Digest registrado pelo run do imagem.yml no push na main
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O run vem da API do GitHub, filtrado por workflow, evento, branch e commit da tag; o
          # artefato só pode ter sido gravado por esse run. A tag sha-<commit> não entra na conta.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/imagem.yml/runs?event=push&branch=main&head_sha=$GITHUB_SHA&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/imagem.yml" and .event == "push"
                    and .head_branch == "main" and .head_sha == $ENV.GITHUB_SHA)] | sort_by(.id) | last | .id // empty')
          [[ "$run" =~ ^[0-9]+$ ]] || { echo "::error::Não há run com sucesso do imagem.yml no push na main para $GITHUB_SHA."; exit 1; }
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name origem-imagem --dir origem \
            || { echo "::error::O run $run não tem o artefato origem-imagem (expirou? docs/operacao/deploy.md)."; exit 1; }
          digest=$(jq -r .digest origem/origem.json)
          commit=$(jq -r .commit origem/origem.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Digest inválido no artefato do run $run."; exit 1; }
          [[ "$commit" == "$GITHUB_SHA" ]] || { echo "::error::O artefato do run $run é do commit $commit, não do da tag."; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Run $run, digest $digest"
      - name: A imagem do digest é do commit da tag
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          revisao=$(docker buildx imagetools inspect "$IMAGEM@$DIGEST" --format '{{json .Image}}' \
            | jq -r '[.. | objects | select(has("Labels")) | .Labels."org.opencontainers.image.revision" // empty] | first // empty')
          [[ "$revisao" == "$GITHUB_SHA" ]] || { echo "::error::O rótulo revision da imagem ($revisao) não é o commit da tag."; exit 1; }
      - name: Migrations desde a release anterior
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          RUN: ${{ steps.digest.outputs.run }}
        run: |
          anterior=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -z "$anterior" ]; then
            mudou="primeira release"
          else
            mudou=$(git diff --name-only "$anterior" "$GITHUB_SHA" -- prisma/migrations)
          fi
          {
            echo "## Release $GITHUB_REF_NAME"
            echo "Digest verificado: \`$DIGEST\`, registrado pelo run $RUN do push na main"
            echo
            echo "Antes de aprovar, confira na tela do run (não neste resumo) que o commit da tag está na main e que o workflow é o da main (docs/operacao/deploy.md)."
            if [ -n "$mudou" ]; then
              echo
              echo "**Há migration ($mudou): tire e confirme o snapshot da Hostinger antes de aprovar o deploy (spec §4.3).**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  prod:
    name: Implantar em prod
    needs: verificar-prod
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PROD_TOKEN }}
      - name: Copiar o digest verificado para sgov2-prod (sem reconstruir)
        env:
          DIGEST: ${{ needs.verificar-prod.outputs.digest }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGEM_PROD:$GITHUB_REF_NAME" -t "$IMAGEM_PROD:prod" \
            "$IMAGEM@$DIGEST"
      - name: Webhook do Easypanel (prod)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "::error::Webhook de prod não cadastrado no environment producao."; exit 1; }
          codigo=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK") || codigo=erro
          [[ "$codigo" == 2?? ]] || { echo "::error::Webhook de prod respondeu $codigo."; exit 1; }
          echo "Deploy de prod solicitado ao Easypanel (HTTP $codigo). Confira no Easypanel que a versão nova subiu."
      # Pedido depois do app, que é quem migra. Os deploys do Easypanel são assíncronos: se o
      # worker novo subir antes da migração, ele falha no outbox, sai e reinicia até o schema chegar.
      - name: Webhook do Easypanel (prod, worker)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK_WORKER }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "::error::Webhook do worker de prod não cadastrado no environment producao."; exit 1; }
          codigo=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK") || codigo=erro
          [[ "$codigo" == 2?? ]] || { echo "::error::Webhook do worker de prod respondeu $codigo."; exit 1; }
          echo "Deploy do worker de prod solicitado ao Easypanel (HTTP $codigo)."

  teste:
    name: Publicar imagem de teste
    if: github.event_name == 'workflow_dispatch' && inputs.acao == 'teste'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validar o nome
        env:
          NOME: ${{ inputs.nome }}
        run: |
          [[ "$NOME" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]] || { echo "::error::nome inválido: use a-z, 0-9 e hífen (até 40)."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: ${{ env.IMAGEM }}:teste-${{ inputs.nome }}
          # Só leitura do cache do Actions (o da main e o da própria branch); nada é gravado.
          cache-from: type=gha

  rollback:
    name: Rollback de prod
    if: github.event_name == 'workflow_dispatch' && inputs.acao == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: O rollback é disparado com --ref de uma tag de release
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Dispare o rollback com --ref vX.Y.Z (recebido: $GITHUB_REF)."; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PROD_TOKEN }}
      - name: sgov2-prod:prod volta para a release escolhida
        run: |
          destino=$(docker buildx imagetools inspect "$IMAGEM_PROD:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$destino" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Não há $IMAGEM_PROD:$GITHUB_REF_NAME."; exit 1; }
          echo "Rollback para $GITHUB_REF_NAME, digest $destino"
          docker buildx imagetools create -t "$IMAGEM_PROD:prod" "$IMAGEM_PROD@$destino"
      - name: Webhook do Easypanel (prod)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "::error::Webhook de prod não cadastrado no environment producao."; exit 1; }
          codigo=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK") || codigo=erro
          [[ "$codigo" == 2?? ]] || { echo "::error::Webhook de prod respondeu $codigo."; exit 1; }
          echo "Rollback de prod para $GITHUB_REF_NAME solicitado ao Easypanel (HTTP $codigo)."
      - name: Webhook do Easypanel (prod, worker)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK_WORKER }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "::error::Webhook do worker de prod não cadastrado no environment producao."; exit 1; }
          codigo=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK") || codigo=erro
          [[ "$codigo" == 2?? ]] || { echo "::error::Webhook do worker de prod respondeu $codigo."; exit 1; }
          echo "Rollback do worker de prod para $GITHUB_REF_NAME solicitado ao Easypanel (HTTP $codigo)."
