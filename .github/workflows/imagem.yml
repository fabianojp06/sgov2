name: Imagem e deploy

# US-013 parte 2/3 (plano do P3, Tarefa 4, Step 7).
# - push na main  → publica sgov2:sha-<commit> e sgov2:hml, atesta a origem e chama o webhook de hml;
# - tag vX.Y.Z    → verificar-prod (sem environment) e prod (environment "producao", aprovação do PO):
#                   copia o digest atestado para sgov2-prod:vX.Y.Z e :prod, sem reconstruir;
# - workflow_dispatch acao=teste    → publica só sgov2:teste-<nome>, sem webhook;
# - workflow_dispatch acao=rollback → disparado pelo PO com --ref vX.Y.Z: sgov2-prod:prod volta a vX.Y.Z.
# Toda condição de job olha o tipo de evento: um dispatch com --ref de tag também tem github.ref de tag.
# Os secrets ficam só nos environments, nunca no repositório.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      acao:
        description: 'teste (publica sgov2:teste-<nome>) ou rollback (volta o prod para a tag do --ref)'
        required: true
        type: choice
        options: [teste, rollback]
      nome:
        description: 'Nome da imagem de teste (a-z, 0-9 e hífen; só para acao=teste)'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGEM: ghcr.io/fabianojp06/sgov2
  IMAGEM_PROD: ghcr.io/fabianojp06/sgov2-prod

jobs:
  hml:
    name: Publicar e implantar em hml
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: homologacao
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM }}:sha-${{ github.sha }}
            ${{ env.IMAGEM }}:hml
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGEM }}:cache
          cache-to: type=registry,ref=${{ env.IMAGEM }}:cache,mode=max
      - name: Atestar a origem (imagem.yml, push na main)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGEM }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Webhook do Easypanel (hml)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Deploy de hml pendente: webhook não cadastrado no environment homologacao (Tarefa 6)."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$WEBHOOK" > /dev/null
          echo "Deploy de hml solicitado ao Easypanel."

  verificar-prod:
    # Sem environment: a aprovação de um environment acontece antes de qualquer passo do job, então
    # as checagens ficam aqui, e o PO lê o resumo antes de aprovar o job prod.
    name: Verificar a release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: O commit da tag está na main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::O commit da tag $GITHUB_REF_NAME não está na main."; exit 1; }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Digest da imagem publicada para o commit
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGEM:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "::error::Não há imagem $IMAGEM:sha-$GITHUB_SHA (o push na main publicou?)."; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Digest: $digest"
      - name: A imagem foi gerada pelo imagem.yml num push na main
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGEM@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/imagem.yml" \
            --source-ref refs/heads/main
      - name: Migrations desde a release anterior
        run: |
          anterior=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -z "$anterior" ]; then
            mudou="primeira release"
          else
            mudou=$(git diff --name-only "$anterior" "$GITHUB_SHA" -- prisma/migrations)
          fi
          {
            echo "## Release $GITHUB_REF_NAME"
            echo "Digest verificado: \`${{ steps.digest.outputs.digest }}\`"
            if [ -n "$mudou" ]; then
              echo
              echo "**Há migration ($mudou): tire e confirme o snapshot da Hostinger antes de aprovar o deploy (spec §4.3).**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  prod:
    name: Implantar em prod
    needs: verificar-prod
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PROD_TOKEN }}
      - name: Copiar o digest verificado para sgov2-prod (sem reconstruir)
        env:
          DIGEST: ${{ needs.verificar-prod.outputs.digest }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGEM_PROD:$GITHUB_REF_NAME" -t "$IMAGEM_PROD:prod" \
            "$IMAGEM@$DIGEST"
      - name: Webhook do Easypanel (prod)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "::error::Webhook de prod não cadastrado no environment producao."; exit 1; }
          curl --fail-with-body -sS -X POST "$WEBHOOK" > /dev/null
          echo "Deploy de prod solicitado ao Easypanel."

  teste:
    name: Publicar imagem de teste
    if: github.event_name == 'workflow_dispatch' && inputs.acao == 'teste'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validar o nome
        env:
          NOME: ${{ inputs.nome }}
        run: |
          [[ "$NOME" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]] || { echo "::error::nome inválido: use a-z, 0-9 e hífen (até 40)."; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: ${{ env.IMAGEM }}:teste-${{ inputs.nome }}
          cache-from: type=registry,ref=${{ env.IMAGEM }}:cache

  rollback:
    name: Rollback de prod
    if: github.event_name == 'workflow_dispatch' && inputs.acao == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: O rollback é disparado com --ref de uma tag de release
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Dispare o rollback com --ref vX.Y.Z (recebido: $GITHUB_REF)."; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PROD_TOKEN }}
      - name: sgov2-prod:prod volta para a release escolhida
        run: docker buildx imagetools create -t "$IMAGEM_PROD:prod" "$IMAGEM_PROD:$GITHUB_REF_NAME"
      - name: Webhook do Easypanel (prod)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "::error::Webhook de prod não cadastrado no environment producao."; exit 1; }
          curl --fail-with-body -sS -X POST "$WEBHOOK" > /dev/null
          echo "Rollback de prod para $GITHUB_REF_NAME solicitado ao Easypanel."
