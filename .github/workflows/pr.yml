name: PR

# Arquivo próprio, separado do ci.yml: mudar label ou corpo do PR roda só esta verificação,
# sem refazer build e testes (spec §12.8).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# O nome do job é usado como check obrigatório na proteção da main: não renomear.
jobs:
  fronteira:
    name: Fronteira de frente
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dados do PR só por env: nunca interpolados dentro de run.
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      CORPO: ${{ github.event.pull_request.body }}
      BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Frente do PR
        id: frente
        # Atribuição separada do echo: dentro do echo, a falha do script não derrubaria o passo.
        run: |
          frente=$(ops/ci/frente-do-pr.sh "$LABELS")
          echo "frente=$frente" >> "$GITHUB_OUTPUT"
      - name: Vínculo com issue
        run: printf '%s' "$CORPO" | ops/ci/vinculo-pr.sh
      - run: npm ci
      - name: Fronteira, PR compartilhado puro e migration única
        env:
          FRENTE: ${{ steps.frente.outputs.frente }}
        run: |
          # --no-renames: renomeação conta como remoção + criação, e as duas pontas são verificadas.
          git diff --name-only --no-renames "origin/$BASE...HEAD" \
            | npx tsx scripts/frentes/verificar.ts --frente "$FRENTE" --labels "$LABELS"
