name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Na main, cada commit mantém o próprio CI (dois merges seguidos não se cancelam).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # "shell: bash" explícito liga o -o pipefail.
    shell: bash

env:
  NODE_OPTIONS: --max-old-space-size=1536
  NEXT_TELEMETRY_DISABLED: '1'

# Os nomes dos jobs são usados como checks obrigatórios na proteção da main: não renomear.
jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:arq
      - run: npm run build

  integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Testcontainers sobre o Docker do runner; o vitest.config.ts já desliga o Ryuk (D12).
      - run: npm run test:int

  e2e:
    # E2E de acesso e do orc (#228): depois do build, sozinho no runner (D12), banco do Testcontainers
    # sem o Ryuk e o next start do global-setup em 127.0.0.1:3190. No CI o Chromium é instalado no
    # runner (E2E_NAVEGADOR_LOCAL=1): o contêiner do navegador (3191) é só para a VPS. O --with-deps
    # usa apt: este job não serve para um runner na VPS (decisão do PO: sem apt no host). No CI não
    # há .env.local: o next start recebe só as variáveis do global-setup (o que faltar quebra aqui).
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A versão do Chromium é a do @playwright/test do package-lock.
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_NAVEGADOR_LOCAL: '1'
      # Também no prazo estourado (cancelado), o caso do travamento.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  migrations:
    # Spec §12.7 item 4: aplica todas as migrations num banco efêmero do CI e compara com o schema.
    # Nunca contra hml ou prod: este job não usa nenhum secret de banco.
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a # pg16
        env:
          # Banco efêmero e sem dados, que só existe durante o job: sem senha nenhuma no repositório.
          POSTGRES_HOST_AUTH_METHOD: trust
        # Só em 127.0.0.1 do runner hospedado pelo GitHub (este job não deve rodar em runner próprio
        # na VPS: seria um Postgres sem senha, na mesma porta do dev da frente B).
        ports:
          - 127.0.0.1:56432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MIGRATE_DATABASE_URL: postgresql://sgo_migrator:sgo_migrator@localhost:56432/sgo_teste
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Conferir que o banco é o efêmero do CI
        run: |
          destino=$(node -e 'const u = new URL(process.env.MIGRATE_DATABASE_URL); console.log(`${u.hostname}:${u.port}`)')
          echo "Banco das migrations: $destino"
          if [ "$destino" != "localhost:56432" ]; then
            echo "::error::MIGRATE_DATABASE_URL fora do banco efêmero do CI ($destino)."
            exit 1
          fi
      - name: Papéis de banco
        run: psql postgresql://postgres@localhost:56432/postgres -v ON_ERROR_STOP=1 -f docker/postgres/init/01-papeis.sql
      # Como em hml e prod (deploy/postgres/01-papeis-ambiente.sql): o superusuário instala o pgvector e
      # fixa os privilégios padrão antes das migrations; o migrator só declara a extensão (US-020).
      - name: Privilégios e extensões (superusuário)
        run: psql postgresql://postgres@localhost:56432/postgres -v ON_ERROR_STOP=1 -f docker/postgres/init/03-privilegios.sql
      - run: npm ci
      - name: Aplicar as migrations
        run: npm run db:deploy
      - name: Comparar o banco migrado com o schema
        # --exit-code: 0 sem diferença, 2 com diferença (reprova), 1 erro.
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

  scripts-operacao:
    name: Scripts de operação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar bats e shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck
      - name: bats
        run: git ls-files '*.bats' | xargs -r -n1 dirname | sort -u | xargs -r bats
      - name: URLs de banco versionadas só de dev
        run: bash ops/verificacoes/urls-banco.sh

  imagem:
    # Constrói a imagem de produção e a testa sem publicar (plano do P3, Tarefa 4, Step 6):
    # sem .env nem .git, migrador sem internet, migration quebrada impedindo o app de subir.
    name: Imagem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build da imagem
        run: docker build -f docker/app.Dockerfile -t sgo:ci .
      - name: Testes da imagem
        run: docker/testes/testar-imagem.sh sgo:ci
